name: NativeAOT compatibility

on:
  pull_request:
    branches:
      - improve-perf
  workflow_dispatch:

jobs:
  nativeaot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: |
          dotnet test EditingSystem/Jewelry.EditingSystem.Tests/Jewelry.EditingSystem.Tests.csproj -c Release
          dotnet test EditingSystem/Jewelry.EditingSystem.CommunityToolkit.Mvvm.SourceGenerators.Tests/Jewelry.EditingSystem.CommunityToolkit.Mvvm.SourceGenerators.Tests.csproj -c Release

      - name: Run Avalonia headless demo tests
        run: dotnet run --project EditingSystem/Jewelry.EditingSystem.Avalonia.Demo.Tests/Jewelry.EditingSystem.Avalonia.Demo.Tests.csproj -c Release --no-launch-profile

      - name: Verify NuGet package analyzers
        run: |
          dotnet build EditingSystem/Jewelry.EditingSystem/Jewelry.EditingSystem.csproj -c Release
          dotnet build EditingSystem/Jewelry.EditingSystem.CommunityToolkit.Mvvm/Jewelry.EditingSystem.CommunityToolkit.Mvvm.csproj -c Release
          dotnet run --project EditingSystem/PackageSmoke/Core/Core.PackageSmoke.csproj -c Release
          dotnet run --project EditingSystem/PackageSmoke/CommunityToolkitMvvm/CommunityToolkitMvvm.PackageSmoke.csproj -c Release

      - name: Publish NativeAOT smoke test
        run: dotnet publish EditingSystem/NativeAotSmoke/NativeAotSmoke.csproj -c Release -r linux-x64 --self-contained true

      - name: Run NativeAOT smoke test
        run: ./EditingSystem/NativeAotSmoke/bin/Release/net10.0/linux-x64/publish/NativeAotSmoke
